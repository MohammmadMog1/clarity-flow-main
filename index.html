<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="صفحة البداية لمشروع Clarity Flow لإدارة المهام والتخطيط." />
    <title>Clarity Flow | البداية</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #17324d;
        background: #f4f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .intro {
        width: min(100%, 680px);
        padding: clamp(2rem, 6vw, 4rem);
        text-align: center;
        background: #ffffff;
        border: 1px solid #d9e5ee;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgb(35 75 104 / 12%);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #397ca8;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.1;
      }

      p {
        max-width: 480px;
        margin: 1rem auto 0;
        color: #526879;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.7rem 1.25rem;
        border-radius: 10px;
        color: #ffffff;
        background: #397ca8;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #2d6388;
      }

      .secondary {
        color: #397ca8;
        background: #e9f2f8;
      }

      .secondary:hover {
        background: #dcebf4;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Clarity Flow</p>
        <h1 id="page-title">ابدأ بتنظيم أفكارك</h1>
        <p>
          هذه صفحة HTML أولية للمشروع. استخدمها كنقطة بداية للصفحات الثابتة أو انتقل إلى تطبيق
          Clarity Flow الحالي.
        </p>
        <nav class="actions" aria-label="روابط البداية">
          <a href="/">فتح التطبيق</a>
          <a class="secondary" href="https://github.com" target="_blank" rel="noreferrer">
            توثيق المشروع
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
